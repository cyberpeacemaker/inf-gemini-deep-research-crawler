[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-research"
version = "0.1.0"
description = "Export Gemini Deep Research reports to lossless markdown and offline HTML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gemini-research = "gemini_research.cli:main"

[tool.setuptools.packages.find]
include = ["gemini_research*"]

[tool.setuptools.package-data]
gemini_research = ["assets/*", "assets/katex/*", "assets/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
